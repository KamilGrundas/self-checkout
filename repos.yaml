workspace:
  name: self-checkout
  path: .
  provider: null
  default_branch: main

repositories:
  admin:
    name: self-checkout-admin
    checkout_directory: self-checkout-admin
    provider: github
    remote: git@github.com:KamilGrundas/self-checkout-admin.git
    default_branch: main
  backend:
    name: self-checkout-backend
    checkout_directory: self-checkout-backend
    provider: github
    remote: git@github.com:KamilGrundas/self-checkout-backend.git
    default_branch: main
  client:
    name: self-checkout-client
    checkout_directory: self-checkout-client
    provider: github
    remote: git@github.com:KamilGrundas/self-checkout-client.git
    default_branch: main
  infra:
    name: self-checkout-infra
    checkout_directory: self-checkout-infra
    provider: github
    remote: git@github.com:KamilGrundas/self-checkout-infra.git
    default_branch: main
  ml:
    name: self-checkout-ml
    checkout_directory: self-checkout-ml
    provider: github
    remote: git@github.com:KamilGrundas/self-checkout-ml.git
    default_branch: main
